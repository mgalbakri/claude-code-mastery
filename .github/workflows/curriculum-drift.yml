name: Curriculum Drift Check

on:
  schedule:
    # Run every Wednesday at 10:00 AM UTC (2 days after Monday scheduler)
    - cron: "0 10 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check curriculum files are in sync
        run: |
          # Verify curriculum.md and site/curriculum.md are identical
          if [ -f curriculum.md ] && [ -f site/curriculum.md ]; then
            if ! diff -q curriculum.md site/curriculum.md > /dev/null 2>&1; then
              echo "::error::curriculum.md and site/curriculum.md are OUT OF SYNC"
              echo "DRIFT_DETECTED=sync" >> "$GITHUB_ENV"
              diff curriculum.md site/curriculum.md | head -20
            else
              echo "curriculum.md and site/curriculum.md are in sync"
            fi
          else
            echo "::warning::One or both curriculum files missing"
          fi

      - name: Check curriculum was updated recently
        run: |
          # Get the date of the last commit that touched curriculum.md
          LAST_UPDATE=$(git log -1 --format="%ai" -- curriculum.md)
          LAST_EPOCH=$(date -d "$LAST_UPDATE" +%s 2>/dev/null || date -jf "%Y-%m-%d %H:%M:%S %z" "$LAST_UPDATE" +%s 2>/dev/null)
          NOW_EPOCH=$(date +%s)
          DAYS_AGO=$(( (NOW_EPOCH - LAST_EPOCH) / 86400 ))

          echo "Last curriculum update: $LAST_UPDATE ($DAYS_AGO days ago)"

          if [ "$DAYS_AGO" -gt 21 ]; then
            echo "::warning::Curriculum has not been updated in $DAYS_AGO days (threshold: 21)"
            echo "DRIFT_DETECTED=stale" >> "$GITHUB_ENV"
            echo "DAYS_STALE=$DAYS_AGO" >> "$GITHUB_ENV"
          else
            echo "Curriculum is fresh ($DAYS_AGO days since last update)"
          fi

      - name: Create issue if drift detected
        if: env.DRIFT_DETECTED != ''
        uses: actions/github-script@v7
        with:
          script: |
            const drift = process.env.DRIFT_DETECTED;
            const days = process.env.DAYS_STALE || '';

            // Check for existing open drift issue to avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'curriculum-drift',
              state: 'open',
            });

            if (existing.data.length > 0) {
              console.log(`Drift issue already open: #${existing.data[0].number}`);
              return;
            }

            let title, body;
            if (drift === 'sync') {
              title = 'Curriculum drift: curriculum.md and site/curriculum.md are out of sync';
              body = [
                '## Curriculum Drift Detected',
                '',
                '`curriculum.md` and `site/curriculum.md` have diverged.',
                'This usually means the scheduler applied changes but failed to commit them,',
                'or a merge overwrote one copy.',
                '',
                '### Fix',
                '```bash',
                'cp curriculum.md site/curriculum.md',
                'git add curriculum.md site/curriculum.md',
                'git commit -m "Sync curriculum files"',
                'git push',
                '```',
                '',
                '*Detected by curriculum-drift workflow*',
              ].join('\n');
            } else {
              title = 'Curriculum stale: no updates in ' + days + ' days';
              body = [
                '## Curriculum Staleness Detected',
                '',
                'The curriculum has not been updated in **' + days + ' days** (threshold: 21).',
                '',
                'Possible causes:',
                '- The launchd scheduler is not running',
                '- The scheduler ran but found no gaps above the priority threshold',
                '- The scheduler applied changes but git commit/push failed',
                '',
                '### Diagnose',
                '```bash',
                '# Check scheduler logs',
                'tail -50 ~/.claude-code-mastery/scheduler.stderr.log',
                '',
                '# Check launchd status',
                'launchctl print gui/$(id -u)/com.claude-code-mastery.checker',
                '',
                '# Run manually',
                'python3 -m claude_code_mastery.scheduler --once',
                '```',
                '',
                '*Detected by curriculum-drift workflow*',
              ].join('\n');
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['curriculum-drift'],
            });
            console.log('Created drift issue');
